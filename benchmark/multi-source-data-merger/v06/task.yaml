instruction: |-
  Merge the user exports from three source systems into one canonical dataset.

  Inputs and field mappings:

  - `/data/source_a/users.json`: `id`, `full_name`, `email`,
    `registration_date`, `status`
  - `/data/source_b/users.csv`: `uid`, `display_name`, `email_address`,
    `signup_date`, `account_state`
  - `/data/source_c/users.parquet`: `userId`, `userName`, `email`, `joined`,
    `active`

  Map them to `user_id`, `name`, `email`, `created_date`, and `status`.
  Store `user_id` as an integer. Trim surrounding whitespace from text fields,
  normalize all supported date representations to `YYYY-MM-DD`, and normalize
  statuses as follows:

  - `active`, `A`, and boolean true become `active`
  - `inactive`, `I`, and boolean false become `inactive`

  Treat null, NaN, an absent field, or a whitespace-only string as missing.

  Merge on `user_id` using source priority `source_a > source_b > source_c`
  independently for every field. Select the highest-priority non-missing value
  for each field; do not select one whole source row when a field needs backfill.

  A conflict exists when at least two sources provide different non-missing values
  for the same user and field after the normalization above. Missing values alone
  are not conflicts. Conflict `values` and `selected` must contain normalized
  values, and `values` must omit sources where that field is missing.

  Write:

  - `/app/merged_users.parquet`, with one row per unique user and columns in this
    exact order: `user_id`, `name`, `email`, `created_date`, `status`
  - `/app/conflicts.json`, shaped as:

    ```
    {
      "total_conflicts": 1,
      "conflicts": [
        {
          "user_id": 123,
          "field": "email",
          "values": {"source_a": "a@example.com", "source_c": "c@example.com"},
          "selected": "a@example.com"
        }
      ]
    }
    ```

  `total_conflicts` must equal the number of conflict entries.

