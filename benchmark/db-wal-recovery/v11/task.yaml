instruction: |-
  I have a database in WAL mode at /app/main.db that tracks inventory items (name, price). The database includes an expensive_items view that should list items with price > 100.

  When I open the database, I only see the base records (5 items) instead of all the data. The WAL file at /app/main.db-wal appears to be corrupted — it won't let SQLite read the full set of records.

  Your task is to:
  1. Recover ALL data from the database (including WAL changes)
  2. Create a JSON file at /app/recovered.json

  The output should be a JSON array of objects sorted by id:
  [{"id": 1, "name": "...", "price": N}, ...]

  After recovery, querying the expensive_items view should return the items with price > 100.
author_name: Task Author
difficulty: hard
category: file-operations
tags:
  - database
  - encryption
  - recovery
parser_name: pytest
max_agent_timeout_sec: 1200
max_test_timeout_sec: 180
run_tests_in_same_shell: false
disable_asciinema: false
