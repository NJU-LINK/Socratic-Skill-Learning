instruction: |-
  Alphabet (GOOGL) daily prices are in /app/googl_prices.csv.

  Calculate 20-period Bollinger Bands from Close:
  - Middle is the trailing 20-observation simple moving average;
  - standard deviation is the population standard deviation of the same
    window, sqrt(sum((x - Middle)^2) / 20);
  - Upper = Middle + 2 * standard deviation;
  - Lower = Middle - 2 * standard deviation.

  Use N/A for all three bands on the first 19 observations, keep intermediate
  values at full precision, and round only displayed values. Write
  /app/results.csv with columns date,close,middle,upper,lower.
author_name: Task Author
difficulty: medium
category: data-analysis
tags:
  - technical-analysis
  - bollinger-bands
  - volatility
parser_name: pytest
max_agent_timeout_sec: 1200
max_test_timeout_sec: 180
run_tests_in_same_shell: false
disable_asciinema: false
