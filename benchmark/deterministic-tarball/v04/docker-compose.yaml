# You usually don't need to modify anything in this file, but you can use it to add
# more containers or configure the client container, if needed.

services:
  client:
    build:
      dockerfile: Dockerfile
    image: ${T_BENCH_TASK_DOCKER_CLIENT_IMAGE_NAME:-Task Author-deterministic-tarball-build01-v04}
    container_name: ${T_BENCH_TASK_DOCKER_CLIENT_CONTAINER_NAME:-Task Author-deterministic-tarball-build01-v04}
    command: ["sh", "-c", "sleep infinity"]
    environment:
      - TEST_DIR=${T_BENCH_TEST_DIR:-/tests}
    volumes:
      - ${T_BENCH_TASK_LOGS_PATH:-/tmp/tbench-logs}:${T_BENCH_CONTAINER_LOGS_PATH:-/tmp/tbench-logs}
      - ${T_BENCH_TASK_AGENT_LOGS_PATH:-/tmp/tbench-agent-logs}:${T_BENCH_CONTAINER_AGENT_LOGS_PATH:-/tmp/tbench-agent-logs}
