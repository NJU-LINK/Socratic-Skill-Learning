services:
  client:
    build:
      dockerfile: Dockerfile
    image: ${T_BENCH_TASK_DOCKER_CLIENT_IMAGE_NAME:-tb-family-organization-json-generator-v01}
    container_name: ${T_BENCH_TASK_DOCKER_CLIENT_CONTAINER_NAME:-tb-family-organization-json-generator-v01}
    command: ["sh", "-c", "sleep infinity"]
    environment:
      - TEST_DIR=${T_BENCH_TEST_DIR:-/tests}
    volumes:
      - ${T_BENCH_TASK_LOGS_PATH:-./logs}:${T_BENCH_CONTAINER_LOGS_PATH:-/var/log/tbench}
      - ${T_BENCH_TASK_AGENT_LOGS_PATH:-./agent-logs}:${T_BENCH_CONTAINER_AGENT_LOGS_PATH:-/var/log/tbench/agent}
