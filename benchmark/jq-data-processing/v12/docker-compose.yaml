services:
  client:
    build:
      dockerfile: Dockerfile
    image: ${T_BENCH_TASK_DOCKER_CLIENT_IMAGE_NAME:-Task Author-jq-role-index}
    container_name: ${T_BENCH_TASK_DOCKER_CLIENT_CONTAINER_NAME:-Task Author-jq-role-index-client}
    command: ["sh", "-c", "sleep infinity"]
    environment:
      - TEST_DIR=${T_BENCH_TEST_DIR:-/tmp/t_bench_tests}
    volumes:
      - ${T_BENCH_TASK_LOGS_PATH:-./.tb-logs}:${T_BENCH_CONTAINER_LOGS_PATH:-/tmp/t_bench_logs}
      - ${T_BENCH_TASK_AGENT_LOGS_PATH:-./.tb-agent-logs}:${T_BENCH_CONTAINER_AGENT_LOGS_PATH:-/tmp/t_bench_agent_logs}
