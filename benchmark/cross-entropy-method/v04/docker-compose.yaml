services:
  client:
    build:
      dockerfile: Dockerfile
    image: ${T_BENCH_TASK_DOCKER_CLIENT_IMAGE_NAME:-cross-entropy-method-client}
    container_name: ${T_BENCH_TASK_DOCKER_CLIENT_CONTAINER_NAME:-cross-entropy-method-client}
    command: ["sh", "-c", "sleep infinity"]
    environment:
      - TEST_DIR=${T_BENCH_TEST_DIR:-/tests}
    volumes:
      - ${T_BENCH_TASK_LOGS_PATH:-./logs}:${T_BENCH_CONTAINER_LOGS_PATH:-/var/log/terminal-bench}
      - ${T_BENCH_TASK_AGENT_LOGS_PATH:-./agent-logs}:${T_BENCH_CONTAINER_AGENT_LOGS_PATH:-/var/log/terminal-bench/agents}
