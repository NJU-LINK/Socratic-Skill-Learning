instruction: |-
  I have a sqlite database in /app/trunc.db that was corrupted — a large contiguous block in the middle of the file was zeroed out, destroying pages in that region. Recover as many of the rows as possible, and create a JSON file in /app/recover.json. The database has a table with two text columns: a word identifier and a status string. The output should have the format [{"word": "testwordXY", "status": "..."}, {"word": "testwordZZ", "status": "..."}, ...]
author_name: Task Author
difficulty: medium
category: debugging
tags:
  - file-operations
parser_name: pytest
max_agent_timeout_sec: 900
max_test_timeout_sec: 180
run_tests_in_same_shell: false
disable_asciinema: false
