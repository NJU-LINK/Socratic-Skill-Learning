services:
  client:
    build:
      dockerfile: Dockerfile
    image: ${T_BENCH_TASK_DOCKER_CLIENT_IMAGE_NAME:-Task Author-bank-trans-filter-v07-client}
    container_name: ${T_BENCH_TASK_DOCKER_CLIENT_CONTAINER_NAME:-Task Author-bank-trans-filter-v07-client}
    command: [ "sh", "-c", "sleep infinity" ]
    environment:
      - TEST_DIR=${T_BENCH_TEST_DIR:-/tests}
    volumes:
      - ${T_BENCH_TASK_LOGS_PATH:-/tmp/Task Author-task-logs}:${T_BENCH_CONTAINER_LOGS_PATH:-/var/log/task}
      - ${T_BENCH_TASK_AGENT_LOGS_PATH:-/tmp/Task Author-agent-logs}:${T_BENCH_CONTAINER_AGENT_LOGS_PATH:-/var/log/agent}
