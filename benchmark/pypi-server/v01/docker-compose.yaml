services:
  client:
    build:
      dockerfile: Dockerfile
    image: ${T_BENCH_TASK_DOCKER_CLIENT_IMAGE_NAME:-stb-pypi-server}
    container_name: ${T_BENCH_TASK_DOCKER_CLIENT_CONTAINER_NAME:-stb-pypi-server}
    command: ["sh", "-c", "sleep infinity"]
    environment:
      - TEST_DIR=${T_BENCH_TEST_DIR:-/tmp/test-dir}
    volumes:
      - ${T_BENCH_TASK_LOGS_PATH:-/tmp/stb-task-logs}:${T_BENCH_CONTAINER_LOGS_PATH:-/tmp/logs}
      - ${T_BENCH_TASK_AGENT_LOGS_PATH:-/tmp/stb-agent-logs}:${T_BENCH_CONTAINER_AGENT_LOGS_PATH:-/tmp/agent-logs}
