instruction: |-
  Create a Python package named `vectorops`, build version `0.1.0` as both a wheel
  and a source distribution, and publish both artifacts to a local PyPI-compatible
  index at `http://localhost:8091/simple`.

  Package contract:
  - Use a `src/` layout and declare build metadata and package discovery in
    `pyproject.toml`.
  - Export `dotproduct` and `vectornorm` at the package top level.
  - `dotproduct(a, b)` returns the dot product of two non-empty, equal-length lists
    of ints or floats.
  - `vectornorm(values)` returns the Euclidean norm of a non-empty numeric list.
  - A non-list argument or a non-numeric element raises `TypeError`.
  - Empty input or unequal dot-product lengths raises `ValueError`.

  Publication contract:
  - Leave the local index service running on port 8091.
  - The index must serve both newly built artifacts for version `0.1.0`.
  - A fresh environment must be able to run:
    `pip install --index-url http://localhost:8091/simple vectorops==0.1.0`
    and then import both public functions.
